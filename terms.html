<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 용어 사전</title>
<style>
  /* 미니루트 5색: 키 #EAF0CC · 서브 #769636 · 테두리 #B5D334 + 글씨 #1F2A12 · 바탕 #F6F7F2 */
  :root { --key: #EAF0CC; --sub: #769636; --line: #B5D334; --ink: #1F2A12; --muted: #5b6152; --body: #3a4131; --paper: #F6F7F2; --card: #fff; --soft: #FAFBF5; --hair: #E3E7D9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { scroll-padding-top: 64px; }
  body { background: var(--paper); color: var(--ink); font-family: Pretendard, "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; }

  /* 헤더 */
  .hero { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .hero-ico { flex: none; width: 56px; height: 56px; border-radius: 18px; background: var(--key); display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(118,150,54,.18); }
  .hero-ico svg { width: 38px; height: 38px; }
  .hero-txt { flex: 1; min-width: 0; }
  .hero h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.6px; }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .count { flex: none; align-self: flex-start; margin-top: 6px; font-size: 13.5px; font-weight: 700; color: var(--muted); background: #fff; border: 1.5px solid var(--hair); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .count b { color: var(--sub); }

  /* 검색 */
  .search { position: relative; margin: 0 0 12px; }
  .search input { width: 100%; height: 58px; padding: 0 52px 0 54px; border: 1.5px solid var(--hair); border-radius: 18px; background: #fff; font: inherit; font-size: 17px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; appearance: none; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input::placeholder { color: #8a907f; }
  .search input:hover { border-color: var(--line); }
  .search input:focus { border-color: var(--line); box-shadow: 0 0 0 4px rgba(181,211,52,.22); }
  .search .s-ico { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--sub); pointer-events: none; }
  .search .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 12px; background: var(--paper); color: var(--muted); cursor: pointer; display: none; place-items: center; }
  .search .clear:hover { background: var(--key); color: var(--ink); }
  .search.has .clear { display: grid; }
  .hint { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -2px 0 14px; font-size: 13px; color: var(--muted); }
  .hint button { border: 1.5px solid var(--hair); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--body); cursor: pointer; }
  .hint button:hover { border-color: var(--line); background: var(--soft); }

  /* 분야 칩 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 8px; border: 1.5px solid var(--hair); border-radius: 999px; background: #fff; color: var(--ink); font-size: 14.5px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s; }
  .chip .ci { width: 26px; height: 26px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; }
  .chip .ci svg { width: 20px; height: 20px; }
  .chip.all { padding-left: 14px; }
  .chip:hover { border-color: var(--line); }
  .chip[aria-pressed="true"] { background: var(--key); border-color: var(--line); }
  .chip[aria-pressed="true"] .ci { background: #fff; }
  .chip small { color: var(--muted); font-weight: 600; font-size: 12.5px; }

  /* 가나다 바로가기 (스티키) */
  .index-bar { position: sticky; top: 0; z-index: 20; margin: 12px -20px 4px; padding: 8px 20px; background: var(--paper); border-bottom: 1.5px solid transparent; transition: border-color .15s; }
  .index-bar.stuck { border-bottom-color: var(--hair); }
  .index { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .index::-webkit-scrollbar { display: none; }
  .index button { flex: none; min-width: 36px; height: 34px; padding: 0 6px; border: 1.5px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); font-size: 14.5px; font-weight: 800; cursor: pointer; }
  .index button:hover:not(:disabled) { border-color: var(--line); background: #fff; color: var(--ink); }
  .index button.on { background: var(--key); color: var(--ink); }
  .index button:disabled { opacity: .28; cursor: default; }

  /* 오늘의 용어 */
  .today { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; margin: 14px 0 6px; padding: 20px 22px; background: #fff; border: 1.5px solid var(--hair); border-radius: 22px; cursor: pointer; transition: border-color .15s, box-shadow .15s; position: relative; }
  .today:hover { border-color: var(--line); box-shadow: 0 6px 18px rgba(31,42,18,.06); }
  .today .big { width: 88px; height: 88px; border-radius: 26px; background: var(--key); display: grid; place-items: center; box-shadow: inset 0 -4px 0 rgba(118,150,54,.16); }
  .today .big svg { width: 62px; height: 62px; }
  .today .lb { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: var(--sub); letter-spacing: .2px; }
  .today .lb i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .today h2 { margin: 4px 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
  .today .ez { margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--body); }
  .today .more { position: absolute; right: 18px; top: 18px; font-size: 13px; font-weight: 700; color: var(--sub); }

  /* 목록 */
  .group { margin-top: 26px; }
  .group h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 15px; font-weight: 800; color: var(--muted); }
  .group h2 span { display: grid; place-items: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 11px; background: var(--key); color: var(--sub); font-size: 17px; }
  .group h2::after { content: ""; flex: 1; height: 1.5px; background: var(--hair); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-items: start; }

  .term { display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1.5px solid var(--hair); border-radius: 20px; padding: 16px 18px 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; scroll-margin-top: 70px; }
  .term:hover { border-color: var(--line); box-shadow: 0 6px 18px rgba(31,42,18,.06); }
  .term:focus-visible { outline: none; border-color: var(--line); box-shadow: 0 0 0 4px rgba(181,211,52,.25); }
  .term.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 35% { border-color: var(--line); box-shadow: 0 0 0 6px rgba(181,211,52,.35); } 100% { box-shadow: 0 0 0 0 rgba(181,211,52,0); } }
  .term-head { display: flex; align-items: center; gap: 12px; }
  .ico { flex: none; width: 48px; height: 48px; border-radius: 15px; background: var(--paper); display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(118,150,54,.10); transition: background .15s; }
  .ico svg { width: 36px; height: 36px; display: block; }
  .term:hover .ico { background: var(--key); }
  .ttl { min-width: 0; flex: 1; }
  .term h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.3px; line-height: 1.3; word-break: keep-all; }
  .tag { display: inline-block; margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--sub); }
  .ez { margin: 0; padding: 10px 12px; background: var(--key); border-radius: 12px; font-size: 14.5px; font-weight: 600; line-height: 1.5; color: var(--ink); word-break: keep-all; }
  .ez b { display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 6px; background: #fff; color: var(--sub); font-size: 11.5px; font-weight: 800; vertical-align: 1px; }
  .def { margin: 0; font-size: 14.5px; line-height: 1.65; color: var(--body); word-break: keep-all; }
  .say { position: relative; display: flex; gap: 10px; padding: 11px 12px; background: var(--soft); border: 1.5px dashed var(--line); border-radius: 14px; font-size: 14px; line-height: 1.55; color: var(--ink); word-break: keep-all; }
  .say svg { flex: none; width: 26px; height: 26px; margin-top: 1px; }
  .say small { display: block; margin-bottom: 1px; font-size: 11.5px; font-weight: 800; color: var(--sub); }
  .rel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 2px; }
  .rel > span { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 2px; }
  .rel button { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px 0 4px; border: 1.5px solid var(--hair); border-radius: 999px; background: #fff; font-size: 13px; font-weight: 700; color: var(--body); cursor: pointer; transition: border-color .15s, background .15s; }
  .rel button svg { width: 22px; height: 22px; }
  .rel button:hover { border-color: var(--line); background: var(--soft); color: var(--ink); }
  mark { background: var(--line); color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty { margin: 30px auto 0; max-width: 460px; padding: 36px 24px; text-align: center; background: #fff; border: 1.5px dashed var(--line); border-radius: 22px; }
  .empty .big { width: 84px; height: 84px; margin: 0 auto 12px; border-radius: 26px; background: var(--key); display: grid; place-items: center; }
  .empty .big svg { width: 58px; height: 58px; }
  .empty h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  .empty p { margin: 0 0 16px; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
  .empty .hint { justify-content: center; margin: 0 0 14px; }
  .btn { height: 42px; padding: 0 18px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--key); font-size: 14.5px; font-weight: 800; color: var(--ink); cursor: pointer; }
  .btn:hover { background: #fff; }
  .note { margin-top: 40px; font-size: 12.5px; color: var(--muted); line-height: 1.6; text-align: center; }

  /* 자세히 보기 시트 */
  .sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(31,42,18,.32); display: none; align-items: center; justify-content: center; padding: 20px; }
  .sheet-bg.open { display: flex; animation: fade .15s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet { position: relative; width: 100%; max-width: 520px; max-height: calc(100vh - 40px); overflow-y: auto; background: #fff; border-radius: 26px; padding: 26px 24px 22px; box-shadow: 0 20px 50px rgba(31,42,18,.18); animation: up .2s ease; }
  @keyframes up { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet .x { position: absolute; right: 14px; top: 14px; width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--paper); color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .sheet .x:hover { background: var(--key); color: var(--ink); }
  .sheet .top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; padding-right: 40px; }
  .sheet .big { flex: none; width: 76px; height: 76px; border-radius: 24px; background: var(--key); display: grid; place-items: center; box-shadow: inset 0 -4px 0 rgba(118,150,54,.16); }
  .sheet .big svg { width: 54px; height: 54px; }
  .sheet h2 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -.4px; word-break: keep-all; }
  .sheet .body { display: flex; flex-direction: column; gap: 12px; }
  .sheet .def { font-size: 15.5px; }
  .sheet .ez { font-size: 15.5px; }
  .sheet .say { font-size: 15px; }
  .sheet .rel { padding-top: 6px; border-top: 1.5px solid var(--hair); margin-top: 4px; padding-top: 14px; }

  @media (max-width: 600px) {
    html { scroll-padding-top: 58px; }
    .wrap { padding: 18px 16px 48px; }
    .hero { gap: 12px; margin-bottom: 14px; }
    .hero-ico { width: 46px; height: 46px; border-radius: 15px; }
    .hero-ico svg { width: 32px; height: 32px; }
    .hero h1 { font-size: 22px; }
    .hero p { font-size: 13.5px; }
    .count { margin-top: 2px; padding: 5px 10px; font-size: 12.5px; }
    .search input { height: 52px; font-size: 16px; border-radius: 16px; padding-left: 48px; }
    .search .s-ico { left: 15px; }
    .chips, .wrap > .hint { flex-wrap: nowrap; overflow-x: auto; margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
    .chips::-webkit-scrollbar, .wrap > .hint::-webkit-scrollbar { display: none; }
    .wrap > .hint > * { flex: none; }
    .index-bar { margin: 10px -16px 2px; padding: 6px 16px; }
    .today { gap: 14px; padding: 16px 16px; align-items: start; }
    .today .big { width: 62px; height: 62px; border-radius: 19px; }
    .today .big svg { width: 44px; height: 44px; }
    .today h2 { font-size: 19px; margin-right: 44px; }
    .today .ez { font-size: 14.5px; }
    .today .more { right: 14px; top: 14px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .term { padding: 15px 15px; border-radius: 18px; }
    .term h3 { font-size: 17px; }
    .sheet-bg { align-items: flex-end; padding: 0; }
    .sheet { max-width: none; border-radius: 24px 24px 0 0; max-height: 88vh; padding: 24px 18px 22px; }
    .sheet .big { width: 64px; height: 64px; border-radius: 20px; }
    .sheet .big svg { width: 46px; height: 46px; }
    .sheet h2 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-ico" id="heroIco" aria-hidden="true"></div>
    <div class="hero-txt">
      <h1>현장 용어 사전</h1>
      <p>처음 보는 용어도 그림과 한 줄 풀이로 쉽게 이해해요.</p>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div class="search" id="searchBox">
    <svg class="s-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="용어나 설명을 검색하세요 (초성도 돼요: ㅁㅊㄱㄱ)" autocomplete="off" aria-label="용어 검색">
    <button type="button" class="clear" id="clearQ" aria-label="검색어 지우기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="chips" id="chips" role="toolbar" aria-label="분야"></div>
  <div class="index-bar" id="indexBar"><nav class="index" id="index" aria-label="가나다 바로가기"></nav></div>
  <section id="today" hidden></section>
  <main id="list"></main>
  <p class="note">설명은 현장 이해를 돕기 위한 요약입니다. 정확한 기준은 상품 약관·회사 규정·관련 법령을 확인하세요.</p>
</div>
<div class="sheet-bg" id="sheetBg" aria-hidden="true"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>

<script>
(function () {
  'use strict';
  // c: 분야, t: 용어, d: 쉬운 설명, s: 고객에게 이렇게 설명해요 (선택)
  var C = { A: '계약·심사', B: '보장·상품', C: '청구·보상', D: '수수료·조직', E: '영업 현장', F: '법·규정' };
  var TERMS = [
    // 계약·심사
    { c: 'A', t: '고지의무', d: '계약 전에 고객이 병력·직업 등 보험사가 묻는 사항을 사실대로 알려야 하는 의무. 최근에는 「계약 전 알릴 의무」라고 부릅니다.', s: '가입하실 때 묻는 건강 질문에 사실대로 답하셔야 나중에 보험금을 제대로 받으실 수 있어요.' },
    { c: 'A', t: '언더라이팅', d: '보험사가 청약서·건강 정보를 보고 가입 가능 여부와 조건(할증·부담보 등)을 정하는 심사 과정.' },
    { c: 'A', t: '부담보', d: '특정 질병이나 신체 부위를 일정 기간 또는 전 기간 보장에서 빼고 가입시키는 조건.', s: '과거 치료하신 부위는 정해진 기간 동안만 보장에서 빠지고, 나머지는 정상 보장돼요.' },
    { c: 'A', t: '할증', d: '건강 상태나 직업 위험 때문에 표준보다 보험료를 더 받는 조건.' },
    { c: 'A', t: '표준체·비표준체', d: '건강·직업 위험이 일반적인 사람을 표준체, 기준보다 위험이 높아 조건이 붙는 사람을 비표준체라고 합니다.' },
    { c: 'A', t: '간편심사(유병자) 보험', d: '심사 질문을 줄여 지병이 있는 사람도 가입하기 쉽게 만든 상품. 대신 보험료가 일반 상품보다 높은 편입니다.', s: '지금 치료 중인 병이 있어도 몇 가지 질문만 통과하면 가입하실 수 있는 상품이에요.' },
    { c: 'A', t: '청약', d: '고객이 보험에 가입하겠다는 의사를 서면·전자 방식으로 보험사에 신청하는 것.' },
    { c: 'A', t: '청약철회', d: '보험증권을 받은 날부터 정해진 기간 안에 이유 없이 가입을 취소하고 보험료를 돌려받을 수 있는 제도.' },
    { c: 'A', t: '품질보증해지', d: '약관·청약서를 전달받지 못했거나 중요 내용 설명이 없었을 때, 일정 기간 안에 계약을 취소하고 보험료를 돌려받는 제도.' },
    { c: 'A', t: '실효', d: '보험료를 정해진 기간까지 내지 않아 계약의 효력이 멈춘 상태.' },
    { c: 'A', t: '부활', d: '실효된 계약을 정해진 기간 안에 밀린 보험료를 내고 다시 살리는 절차. 다시 심사를 받을 수 있습니다.' },
    { c: 'A', t: '전자청약', d: '종이 대신 휴대폰·태블릿으로 청약서 작성과 서명을 끝내는 방식.' },
    { c: 'A', t: '알릴의무 위반', d: '계약 전 알릴 의무를 지키지 않은 것. 보험사가 계약을 해지하거나 관련 보험금을 지급하지 않을 수 있습니다.' },
    { c: 'A', t: '가입설계', d: '고객 정보와 원하는 보장을 바탕으로 상품·특약·가입금액·보험료를 미리 짜 보는 것. 결과물을 가입설계서라고 합니다.', s: '고객님께 맞춰 보장과 보험료를 미리 짜 본 설계서부터 보여 드릴게요.' },
    { c: 'A', t: '청약서', d: '가입 신청 내용과 알릴 의무 질문에 대한 답을 적고 계약자·피보험자가 서명하는 문서.' },
    { c: 'A', t: '청약서 부본', d: '청약서의 고객 보관용 사본. 청약 후 반드시 고객에게 전달해야 합니다.', s: '가입하신 내용이 적힌 고객님 보관용 사본이니 잘 보관해 두세요.' },
    { c: 'A', t: '서면청약', d: '종이 청약서에 직접 적고 서명해 청약하는 방식. 전자청약과 대비됩니다.' },
    { c: 'A', t: '자필서명', d: '계약자·피보험자가 청약서 등에 직접 하는 서명. 다른 사람이 대신 서명하면 계약이 무효가 될 수 있습니다.', s: '이 서명은 꼭 본인이 직접 해 주셔야 계약이 제대로 효력을 가져요.' },
    { c: 'A', t: '전자서명', d: '전자청약 때 화면에 직접 하는 서명이나, 인증서·간편인증으로 대신하는 서명.' },
    { c: 'A', t: '보정', d: '청약·청구 서류에 빠지거나 틀린 부분이 있을 때 보완을 요청받거나 서류를 고쳐 다시 내는 것.' },
    { c: 'A', t: '신계약', d: '새로 체결된 계약. 실적과 수수료 계산의 기준이 됩니다.' },
    { c: 'A', t: '계약전환', d: '기존 계약을 해지하지 않고 같은 회사의 다른 상품으로 바꾸는 제도. 전환 조건은 상품마다 다릅니다.' },
    { c: 'A', t: '경과기간', d: '계약일부터 지금까지 지난 기간. 면책·감액기간, 환급금, 수수료 환수 여부를 따지는 기준이 됩니다.' },
    { c: 'A', t: '초회보험료', d: '계약 후 처음 내는 보험료. 보통 이 보험료가 납입되어야 보장이 시작됩니다.', s: '첫 보험료가 들어가는 날부터 보장이 시작돼요.' },
    { c: 'A', t: '납입주기', d: '보험료를 내는 간격. 월납·3개월납·6개월납·연납·일시납 등이 있습니다.', s: '보험료는 매달 내셔도 되고, 1년에 한 번 모아서 내셔도 돼요.' },
    { c: 'A', t: '자동이체', d: '정해진 날 지정 계좌에서 보험료가 자동으로 빠져나가게 하는 납입 방식.', s: '매달 정해진 날 통장에서 자동으로 나가서, 깜빡하고 못 내실 걱정이 줄어요.' },
    { c: 'A', t: '보험계약자', d: '‘계약자’와 같은 말. 보험사와 계약을 맺고 보험료를 내며 계약 변경·해지 권리를 가진 사람입니다. ‘계약자·피보험자’ 참고.' },
    { c: 'A', t: '피보험자', d: '보험 사고(질병·상해·사망 등)의 대상이 되는 사람. ‘계약자·피보험자’ 참고.', s: '이 보험으로 보장받으시는 분이 피보험자예요.' },
    { c: 'A', t: '보험증권', d: '계약이 성립했음을 증명하는 문서. 계약자·피보험자·보장 내용·보험기간 등이 적혀 있습니다.', s: '가입하신 내용이 모두 담긴 증명서라서, 보험금 청구하실 때를 위해 잘 보관해 주세요.' },
    { c: 'A', t: '약관', d: '보장 내용·지급 조건·면책 사항 등 보험 계약의 규칙을 정한 문서. 분쟁이 생기면 약관이 기준이 됩니다.', s: '보험금이 언제, 얼마나 나오는지는 모두 이 약관에 정해져 있어요.' },
    { c: 'A', t: '해피콜', d: '계약 후 보험사가 고객에게 전화해 설명을 제대로 들었는지, 직접 서명했는지 등을 확인하는 절차. ‘완전판매 모니터링’ 참고.', s: '며칠 안에 보험사에서 확인 전화가 오면 편하게 사실대로 답해 주시면 돼요.' },

    // 보장·상품
    { c: 'B', t: '주계약·특약', d: '상품의 기본이 되는 보장이 주계약, 원하는 보장을 덧붙이는 것이 특약입니다.' },
    { c: 'B', t: '갱신형', d: '정해진 기간마다 계약이 갱신되며 그때 나이·손해율에 따라 보험료가 바뀔 수 있는 상품.', s: '처음 보험료는 저렴하지만, 몇 년마다 다시 계산돼서 오를 수 있어요.' },
    { c: 'B', t: '비갱신형', d: '납입 기간 동안 보험료가 처음 정한 금액 그대로 유지되는 상품.', s: '처음엔 조금 비싸도 다 내실 때까지 보험료가 오르지 않아요.' },
    { c: 'B', t: '면책기간', d: '가입 후 일정 기간 동안 특정 보장(예: 암)을 보장하지 않는 기간.', s: '가입하고 바로가 아니라 정해진 날 이후부터 보장이 시작되는 항목이 있어요.' },
    { c: 'B', t: '감액기간', d: '가입 후 일정 기간 안에 사고가 나면 보험금을 일부(예: 50%)만 지급하는 기간.' },
    { c: 'B', t: '납입면제', d: '큰 병이나 장해가 생기면 이후 보험료를 내지 않아도 보장은 그대로 유지되는 기능.', s: '큰 병에 걸리시면 그다음부터는 보험료를 안 내셔도 보장은 계속돼요.' },
    { c: 'B', t: '실손의료보험', d: '실제로 쓴 병원비(급여·비급여)를 자기부담금을 뺀 범위에서 돌려주는 보험. 여러 개 가입해도 실제 쓴 돈 이상은 받지 않습니다.' },
    { c: 'B', t: '종신보험', d: '언제 사망하든 평생 사망보험금을 보장하는 상품.' },
    { c: 'B', t: '정기보험', d: '정해진 기간(예: 60세까지) 동안만 사망을 보장하는 상품. 종신보험보다 보험료가 저렴합니다.' },
    { c: 'B', t: '무해지·저해지 상품', d: '납입 기간 중 해지하면 환급금이 없거나 적은 대신 보험료가 저렴한 상품.', s: '중간에 해지하면 돌려받는 돈이 거의 없는 대신, 매달 보험료가 싸요.' },
    { c: 'B', t: '순수보장형', d: '만기 때 돌려받는 돈 없이 보장에만 집중한 상품.' },
    { c: 'B', t: '해지환급금', d: '계약을 중간에 해지할 때 돌려받는 돈. 낸 보험료보다 적을 수 있습니다.' },
    { c: 'B', t: '만기환급금', d: '보험 기간이 끝났을 때 돌려받는 돈. 상품 구조에 따라 없을 수도 있습니다.' },
    { c: 'B', t: '변액보험', d: '보험료 일부를 펀드에 투자해 수익률에 따라 보험금이나 환급금이 달라지는 상품.' },
    { c: 'B', t: '유니버셜 기능', d: '보험료를 일정 기간 뒤 쉬거나 더 내고, 적립금을 일부 꺼내 쓸 수 있는 기능.' },
    { c: 'B', t: '가입금액', d: '사고가 났을 때 보험사가 지급하기로 정한 보장 금액(예: 암진단비 3,000만 원).' },
    { c: 'B', t: '보험료', d: '보장을 받는 대가로 계약자가 보험사에 내는 돈. 나이·성별·건강·보장 내용에 따라 달라집니다.' },
    { c: 'B', t: '종합의료보험', d: '질병·상해로 인한 진단·입원·수술 등 의료 관련 보장을 한 상품에 모아 놓은 보험.', s: '아프시거나 다치셨을 때 필요한 보장을 하나로 묶어 둔 보험이에요.' },
    { c: 'B', t: '상해보험', d: '우연한 외부 사고로 다쳤을 때 사망·후유장해·치료비 등을 보장하는 보험.' },
    { c: 'B', t: '연금보험', d: '일정 기간 보험료를 모은 뒤 정한 나이부터 연금으로 나눠 받는 상품.', s: '나중에 매달 월급처럼 받으시도록 지금부터 모아 두는 보험이에요.' },
    { c: 'B', t: 'CI보험', d: 'Critical Illness(중대한 질병) 보험. 암·심근경색 등 중대 질병 진단 시 사망보험금 일부를 미리 받을 수 있는 상품.', s: '큰 병에 걸리시면 사망보험금 일부를 미리 받아 치료비로 쓰실 수 있어요.' },
    { c: 'B', t: '보증보험', d: '계약 이행이나 채무 등을 보증해 주는 보험. 상대방이 의무를 지키지 않으면 보험사가 대신 손해를 물어 줍니다.' },
    { c: 'B', t: '책임준비금', d: '보험사가 앞으로 지급할 보험금·환급금에 대비해 쌓아 두는 돈.' },

    // 청구·보상
    { c: 'C', t: '미청구 보험금', d: '보장을 받을 수 있는데 고객이 아직 청구하지 않은 보험금. 「숨은 보험금」이라고도 합니다.', s: '받으실 수 있는데 아직 안 받으신 보험금이 있는지 찾아드릴게요.' },
    { c: 'C', t: '소멸시효', d: '보험금을 청구할 수 있는 기간. 사고일로부터 3년이 지나면 청구권이 사라집니다.', s: '병원 다녀오신 지 3년이 지나면 청구가 어려워서, 그 전에 꼭 챙기셔야 해요.' },
    { c: 'C', t: '손해사정', d: '사고 내용과 손해액을 조사해 지급할 보험금을 산정하는 일. 이를 하는 전문가가 손해사정사입니다.' },
    { c: 'C', t: '지급심사', d: '청구된 보험금이 약관상 지급 대상인지 보험사가 확인하는 절차.' },
    { c: 'C', t: '의료자문', d: '보험사가 지급 판단을 위해 다른 의사에게 진단·치료 적정성에 대한 의견을 구하는 것.' },
    { c: 'C', t: '수익자', d: '보험금을 받는 사람. 계약자·피보험자와 다를 수 있습니다.' },
    { c: 'C', t: '비례보상', d: '같은 보장을 여러 보험에 가입했을 때 실제 손해액을 각 보험이 나눠서 지급하는 방식(주로 실손·배상책임).' },
    { c: 'C', t: '진단비', d: '특정 질병을 진단받으면 정해진 금액을 한 번에 지급하는 보장.' },
    { c: 'C', t: '입원일당·수술비', d: '입원한 날수만큼, 또는 수술 종류에 따라 정해진 금액을 지급하는 보장.' },
    { c: 'C', t: '지정대리청구', d: '피보험자가 직접 보험금을 청구하기 어려운 경우를 대비해 미리 정해 둔 가족이 대신 청구할 수 있게 하는 제도.', s: '혹시 직접 청구하기 어려우실 때를 대비해 가족분을 대리인으로 정해 두시면 좋아요.' },

    // 수수료·조직
    { c: 'D', t: 'GA', d: '여러 보험사 상품을 함께 판매하는 독립 법인대리점(General Agency).' },
    { c: 'D', t: '원수사', d: 'GA가 판매하는 상품을 실제로 만들고 보장하는 보험회사.' },
    { c: 'D', t: '1200%룰', d: '계약 첫해 설계사·GA에 지급할 수 있는 수수료·시책 합계를 월 보험료의 1200% 이내로 제한한 규정.' },
    { c: 'D', t: '분급', d: '수수료를 한 번에 주지 않고 여러 해에 나눠 지급하는 방식. 계약 유지와 환수 예방을 위한 제도입니다.' },
    { c: 'D', t: '선지급', d: '나중에 받을 수수료나 시책 일부를 미리 앞당겨 받는 것.' },
    { c: 'D', t: '환수', d: '계약이 일찍 해지·실효되면 이미 받은 수수료를 다시 돌려내는 것.' },
    { c: 'D', t: '유지율', d: '체결한 계약이 일정 기간(13회차·25회차 등) 뒤에도 유지되는 비율. 설계사 계약 품질의 핵심 지표입니다.' },
    { c: 'D', t: '시책', d: '보험사·GA가 특정 기간·상품 실적에 대해 수수료 외에 추가로 주는 인센티브.' },
    { c: 'D', t: '오버라이드(OR)', d: '소속 설계사 실적에 따라 관리자(지점장 등)가 받는 관리 수수료.' },
    { c: 'D', t: '정착지원금', d: 'GA로 옮긴 설계사가 자리 잡을 때까지 일정 기간 지원하는 금액. 조건에 따라 반환 의무가 있을 수 있습니다.' },
    { c: 'D', t: '위촉·해촉', d: '설계사를 소속으로 등록하는 것이 위촉, 소속을 해지하는 것이 해촉입니다.' },
    { c: 'D', t: '설계사 코드', d: '보험사가 설계사에게 부여하는 고유 번호. 이 코드로 계약과 수수료가 연결됩니다.' },
    { c: 'D', t: '설계사', d: '보험회사나 대리점에 등록해 보험 계약을 모집하는 사람. 정식 명칭은 보험설계사입니다.' },
    { c: 'D', t: '모집인', d: '보험 계약 체결을 중개·대리하는 사람을 이르는 말. 설계사·대리점 등 모집 종사자를 넓게 가리킵니다.' },
    { c: 'D', t: 'FP', d: 'Financial Planner(재무설계사). 현장에서는 보험설계사를 부르는 말로도 널리 쓰입니다.' },
    { c: 'D', t: '기업형 GA', d: '본사가 조직·교육·전산을 직접 통제하며 하나의 회사처럼 운영하는 GA.' },
    { c: 'D', t: '자회사형 GA', d: '보험사가 자회사로 세운 GA. 모회사 상품뿐 아니라 다른 회사 상품도 판매합니다.' },
    { c: 'D', t: '계약이관', d: '담당 설계사가 그만두거나 바뀔 때 계약의 관리 담당을 다른 설계사·조직으로 옮기는 것.' },
    { c: 'D', t: '수수료', d: '계약을 모집하고 유지한 대가로 보험사가 설계사·GA에 지급하는 돈.' },

    var t = e.target;
    var j = t.closest('[data-jump]'); if (j) { e.stopPropagation(); return jumpTo(+j.dataset.jump); }
    var g = t.closest('[data-go]'); if (g) { var el = document.getElementById('g-' + g.dataset.go); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var h = t.closest('[data-q]'); if (h) { $('#q').value = h.dataset.q; state.q = h.dataset.q; render(); return; }
    if (t.closest('[data-reset]')) { $('#q').value = ''; state.q = ''; state.cat = 'all'; renderChips(); render(); $('#q').focus(); return; }
    if (window.getSelection && String(window.getSelection()).length > 1) return; // 글자 드래그 복사 중엔 열지 않음
    var o = t.closest('.term[data-open], .today[data-open]'); if (o) openSheet(+o.dataset.open);
  });

  $('#q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  $('#clearQ').addEventListener('click', function () { $('#q').value = ''; state.q = ''; render(); $('#q').focus(); });

  // 스티키 바 그림자 + 현재 위치한 가나다 표시
  var bar = $('#indexBar'), ticking = false;
  function onScroll() {
    ticking = false;
    bar.classList.toggle('stuck', bar.getBoundingClientRect().top <= 0.5);
    var cur = null, hs = document.querySelectorAll('.group h2');
    for (var i = 0; i < hs.length; i++) { if (hs[i].getBoundingClientRect().top < 90) cur = hs[i].id.slice(2); else break; }
    $('#index').querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.go === cur); });
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

  $('#heroIco').innerHTML = svg('book');
  function setPh() { $('#q').placeholder = window.innerWidth <= 600 ? '용어 검색 (초성도 돼요: ㅁㅊㄱㄱ)' : '용어나 설명을 검색하세요 (초성도 돼요: ㅁㅊㄱㄱ)'; }
  window.addEventListener('resize', setPh); setPh();
  renderChips(); render(); onScroll();
})();
</script>
</body>
</html>
