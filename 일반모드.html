<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1d4d3a">
<title>ROOT · 4가지 화면 모드 비교</title><meta name="description" content="ROOT 라이트와 블랙마스터의 간편·오리지널 화면 비교 시안. 실제 메뉴구조와 손그림을 바탕으로 구성했습니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --green:#769636; --green-dk:#769636; --green-deep:#123829;
  --mint:#EAF0CC; --mint-2:#EAF0CC;
  --bg:#edf3ef; --card:#fff; --line:#EAF0CC; --line-2:#EAF0CC;
  --ink:#16261f; --ink-2:#4a5d54; --ink-3:#7a8b83;
  --accent:var(--green); --accent-dk:var(--green-dk); --accent-soft:var(--mint); --on-accent:#fff;
  --top-bg:#fff; --top-ink:var(--ink); --top-sub:var(--ink-2); --top-line:var(--line);
  --r-xl:26px; --r-lg:22px; --r-md:14px;
  --shadow:0 1px 2px rgba(18,56,41,.06),0 6px 18px rgba(18,56,41,.06);
  --shadow-hover:0 2px 4px rgba(18,56,41,.08),0 14px 30px rgba(18,56,41,.12);
  --t-notice:#a5432c; --t-notice-bg:#fbe9e3; --t-sales:#8a6418; --t-sales-bg:#f9efd9; --t-news:#769636; --t-news-bg:#EAF0CC;
}
body.master{
  --accent:#9a7425; --accent-dk:#1d2622; --accent-soft:#f5eedd; --on-accent:#fff;
  --bg:#f0ede5; --line:#e4ddcd; --line-2:#d6ccb6; --ink:#1d2622; --ink-2:#575a50; --ink-3:#8a8a7c;
  --top-bg:#1d2622; --top-ink:#f4efe2; --top-sub:#c9c2ad; --top-line:#2f3a35;
  --gold:#d4ad55; --gold-dk:#9a7425;
  --shadow:0 1px 2px rgba(40,32,14,.06),0 6px 18px rgba(40,32,14,.07);
  --shadow-hover:0 2px 4px rgba(40,32,14,.08),0 14px 30px rgba(40,32,14,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;padding-bottom:96px}
button,input,a{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:none;color:inherit;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #f2b13c;outline-offset:3px}
svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
img{display:block}
.nw{white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ===== 시안 비교 막대 ===== */
.review{background:#EAF0CC;border-bottom:1px solid var(--line-2);padding:10px 32px;display:flex;align-items:center;justify-content:center;gap:22px}
body.master .review{background:#e7e1d2;border-color:#d6ccb6}
.review-title{font-size:13px;color:#4a5d54;line-height:1.5;flex-shrink:0}
.review-title b{display:block;font-size:16px;color:#123829;font-weight:800}
body.master .review-title b{color:#1d2622}
.review nav{display:grid;grid-template-columns:repeat(4,auto);gap:4px;background:#fff;border:1px solid var(--line-2);border-radius:16px;padding:5px}
.review nav button{min-height:46px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:700;color:#769636;white-space:nowrap}
.review nav button:hover{background:#eef5f1}
.review nav button[aria-pressed=true]{background:#769636;color:#fff;box-shadow:0 3px 10px rgba(118, 150, 54,.25)}
.review nav button[data-plan=master][aria-pressed=true]{background:#1d2622;color:#f1d48a;box-shadow:0 3px 10px rgba(29,38,34,.3)}
.review small{font-size:12px;color:#5a6b63;line-height:1.55;max-width:180px}

/* ===== 틀 ===== */
#workspace{max-width:1600px;margin:0 auto}
#workspace.original-shell{display:grid;grid-template-columns:248px minmax(0,1fr);gap:0;max-width:none}
.col{min-width:0}

/* ===== 상단 바 ===== */
.topbar{background:var(--top-bg);border-bottom:1px solid var(--top-line);color:var(--top-ink)}
#workspace:not(.original-shell) .topbar{box-shadow:0 0 0 100vmax var(--top-bg);clip-path:inset(0 -100vmax)}
.original-shell .topbar{border-radius:0 0 0 0}
.topbar-in{min-height:80px;padding:12px 40px;display:flex;align-items:center;gap:18px}
.brand{flex:none;display:flex;align-items:center;height:48px;padding:6px 10px;border-radius:12px}
.brand img{height:34px;width:auto}
body.master .brand{background:#fff;padding:6px 14px}
.intro{display:flex;align-items:center;gap:10px;margin:0;padding-left:18px;border-left:1.5px solid var(--line-2);font-size:16px;color:var(--top-sub);white-space:nowrap;min-width:0;overflow:hidden}
body.master .intro{border-color:#45514b}
.intro b{color:var(--accent-dk);font-weight:800}
body.master .intro b{color:var(--gold)}
.intro span{overflow:hidden;text-overflow:ellipsis}
.mode-info{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
.tier{font-size:12px;font-weight:800;letter-spacing:1.2px;background:var(--mint);color:var(--green-dk);padding:8px 12px;border-radius:8px}
body.master .tier{background:linear-gradient(180deg,#e2c072,#c99e45);color:#1d2622}
.mode-name{font-size:16px;font-weight:600;color:var(--top-sub)}
.tools{display:flex;align-items:center;gap:10px}
.switch{display:flex;padding:4px;background:#eef3f0;border:1px solid var(--line);border-radius:14px;gap:4px}
body.master .switch{background:#2a3530;border-color:#3a4740}
.switch button{min-height:44px;padding:0 20px;border-radius:10px;font-size:16px;font-weight:700;color:var(--ink-2)}
body.master .switch button{color:#d9d2bf}
.switch button[aria-pressed=true]{background:var(--green-dk);color:#fff;box-shadow:0 3px 8px rgba(118, 150, 54,.25)}
body.master .switch button[aria-pressed=true]{background:var(--gold);color:#1d2622;box-shadow:none}
.hint-btn{white-space:nowrap;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;font-size:16px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.hint-btn::before{content:"?";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dk);font-size:13px;font-weight:800}
body.master .hint-btn{background:transparent;border-color:#4a5650;color:#f4efe2}
body.master .hint-btn::before{background:#3a4740;color:var(--gold)}
.hint-btn:hover{border-color:var(--accent)}

/* ===== 본문 ===== */
.app{padding:28px 40px 24px}
.lead{display:flex;align-items:flex-start;gap:20px;margin-bottom:22px}
.lead .ruti{margin-top:-18px}
.lead .bubble{margin-top:-3px}
.ruti{flex:none;width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(14,32,25,.14))}
.bubble{position:relative;flex:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 26px;box-shadow:0 4px 16px rgba(14,32,25,.06)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:16px;height:16px;background:#fff;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble h2{margin:0;font-size:28px;line-height:1.3;font-weight:800;letter-spacing:-.02em;color:var(--green-deep)}
body.master .bubble h2{color:#1d2622}
.search-wrap{position:relative;flex:1;min-width:0}
.searchbox{display:flex;align-items:center;background:#fff;border:2.5px solid var(--accent);border-radius:20px;height:68px;padding:0 8px 0 0;box-shadow:0 6px 18px rgba(18,56,41,.08)}
.searchbox:focus-within{box-shadow:0 0 0 5px rgba(118, 150, 54,.16)}
body.master .searchbox:focus-within{box-shadow:0 0 0 5px rgba(154,116,37,.18)}
.searchbox input{flex:1;min-width:0;border:0;background:none;outline:none;padding:0 22px;font-size:20px;color:var(--ink)}
.searchbox input::placeholder{color:#7d8c85;opacity:1}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none}
.searchbox button{flex:none;width:52px;height:52px;border-radius:15px;background:var(--accent);color:#fff;display:grid;place-items:center}
body.master .searchbox button{background:#1d2622;color:var(--gold)}
.search-help{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:15px;color:var(--ink-2)}
.search-help span{font-weight:700;margin-right:4px}
.search-help button{min-height:46px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line-2);font-size:15px;font-weight:700;color:var(--accent-dk)}
body.master .search-help button{color:#6f5418}
.search-help button:hover{border-color:var(--accent);background:var(--accent-soft)}
.search-results{position:absolute;top:76px;left:0;right:0;z-index:25;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 22px 50px rgba(14,32,25,.22);padding:12px}
.search-results[hidden]{display:none}
.close-search{float:right;min-height:44px;min-width:64px;padding:0 14px;border-radius:10px;background:#eef3f0;font-size:15px;font-weight:700;color:var(--ink-2)}
.group-label{font-size:15px;font-weight:800;color:var(--accent);padding:10px 10px 8px}
.result{width:100%;display:flex;align-items:center;gap:14px;text-align:left;min-height:64px;padding:8px 10px;border-radius:14px;font-size:18px;font-weight:700;color:var(--ink)}
.result:hover{background:var(--accent-soft)}
.result .r-art{flex:none;width:46px;height:46px;border-radius:13px;background:linear-gradient(160deg,#f3f8f4,#EAF0CC);display:grid;place-items:center}
body.master .result .r-art{background:linear-gradient(160deg,#faf6ec,#efe6d2)}
.result .r-art img{width:40px;height:40px}
.result .r-txt{flex:1;min-width:0;line-height:1.35}
.result small{display:block;font-size:15px;font-weight:500;color:var(--ink-2);margin-top:2px}
.result .chev{color:var(--ink-3);width:20px;height:20px}
.empty-search{font-size:16px;line-height:1.7;color:var(--ink-2);padding:8px 10px 10px}

/* 업무 메뉴 */
.portal-nav{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;margin-bottom:22px;box-shadow:var(--shadow)}
.portal-nav button,.portal-home{display:inline-flex;align-items:center;min-height:52px;padding:0 20px;border-radius:13px;font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap}
.portal-nav button:hover{background:var(--accent-soft)}
.portal-home{background:var(--green-dk);color:#fff}
body.master .portal-home{background:#1d2622;color:var(--gold)}
.portal-nav time{margin-left:auto;padding-right:14px;font-size:15px;color:var(--ink-2);white-space:nowrap}

/* 간편 2단 */
.simple-grid{display:grid;grid-template-columns:minmax(0,1fr) clamp(470px,38vw,580px);gap:24px;align-items:stretch}
.simple-grid .left{display:flex;flex-direction:column}
.simple-grid .left .news-panel{flex:1}
.card,.news-panel,.right{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow)}
.news-panel{overflow:hidden;min-width:0}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 26px 14px}
.panel-heading h2,.quick-title h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--green-deep)}
body.master .panel-heading h2,body.master .quick-title h2{color:#1d2622}
.panel-heading span{font-size:14px;color:var(--ink-2)}
.board-link{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;background:var(--accent-soft);font-size:15px;font-weight:700;color:var(--accent-dk)}
body.master .board-link{color:#6f5418}
.board-link:hover{filter:brightness(.97)}
.tabs{display:flex;gap:8px;padding:0 26px 6px;flex-wrap:wrap}
.tabs button{min-height:48px;min-width:88px;padding:0 18px;border-radius:999px;background:#f1f5f2;border:1px solid var(--line);font-size:16px;font-weight:700;color:var(--ink-2)}
body.master .tabs button{background:#f6f3eb}
.tabs button:hover{border-color:var(--line-2);color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--green-dk);border-color:var(--green-dk);color:#fff}
body.master .tabs button[aria-selected=true]{background:#1d2622;border-color:#1d2622;color:var(--gold)}
.portal-lead{display:grid;grid-template-columns:minmax(200px,42%) minmax(0,1fr);margin:16px 26px 8px;border-radius:20px;overflow:hidden;background:#f3f8f4;border:1px solid var(--line)}
body.master .portal-lead{background:#f8f4ea}

.lead-copy{align-self:center;padding:24px 28px}
.lead-section{display:inline-block;padding:5px 11px;border-radius:999px;font-size:14px;font-weight:800;background:var(--t-sales-bg);color:var(--t-sales)}
.lead-copy h3{margin:12px 0 8px;font-size:26px;line-height:1.35;letter-spacing:-.02em;font-weight:800;color:var(--ink)}
.lead-copy p{margin:0;font-size:16px;line-height:1.6;color:var(--ink-2)}
.lead-action{margin-top:16px;display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;background:var(--green-dk);color:#fff;font-size:16px;font-weight:700}
body.master .lead-action{background:#1d2622;color:var(--gold)}
.lead-action svg{width:18px;height:18px}
.news-items{padding:0 26px 10px}
.news-item{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border-top:1px solid #edf1ee;padding:16px 4px;min-height:84px}
.news-item:first-child{border-top:0}
.news-item:hover .news-text b{color:var(--accent)}
.news-badge{flex:0 0 78px;text-align:center;font-size:14px;font-weight:800;padding:7px 4px;border-radius:999px;background:var(--t-news-bg);color:var(--t-news)}
.news-item[data-category="공지"] .news-badge{background:var(--t-notice-bg);color:var(--t-notice)}
.news-item[data-category="영업자료"] .news-badge{background:var(--t-sales-bg);color:var(--t-sales)}
.news-text{flex:1;min-width:0}
.news-text b{display:block;font-size:18px;font-weight:700;line-height:1.45;color:var(--ink)}
.news-text small{display:block;margin-top:4px;font-size:15px;color:var(--ink-2);line-height:1.45}
.news-item .arrow{color:var(--ink-3)}
.news-item .arrow svg{width:22px;height:22px}
.empty-news{padding:28px;color:var(--ink-2);font-size:16px}

/* 자주 쓰는 업무 */
.right{padding:24px 22px 22px}
.quick-title{display:flex;align-items:center;justify-content:space-between;margin:0 4px 16px}
.quick-title span{font-size:14px;color:var(--ink-2)}
.quick-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quick{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;width:100%;min-height:178px;padding:20px 20px 20px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.quick::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);opacity:0;transition:opacity .15s}
.quick:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--line-2)}
.quick:hover::before{opacity:1}
.q-art{flex:none;width:72px;height:72px;border-radius:20px;background:linear-gradient(160deg,#f1f7f3 0%,#EAF0CC 100%);display:grid;place-items:center}
body.master .q-art{background:linear-gradient(160deg,#faf6ec 0%,#efe3c8 100%)}
.q-art img{width:62px;height:62px}
.quick-text{display:block;min-width:0;width:100%}
.quick-text b{display:block;font-size:21px;font-weight:800;line-height:1.3;letter-spacing:-.02em;color:var(--ink)}
.quick-text small{display:block;margin-top:6px;font-size:16px;line-height:1.45;color:var(--ink-2);text-wrap:balance}
.quick-text b,.news-text b,.news-text small{text-wrap:balance}
.q-go{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
body.master .q-go{background:#1d2622;color:var(--gold)}
.q-go svg{width:18px;height:18px;stroke-width:2.6}
.more-toggle{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:14px;border-radius:16px;background:var(--green-dk);color:#fff;font-size:18px;font-weight:800;box-shadow:0 4px 12px rgba(118, 150, 54,.2)}
body.master .more-toggle{background:#1d2622;color:var(--gold);box-shadow:0 4px 12px rgba(29,38,34,.25)}
.more-toggle svg{transition:transform .2s}
.more-toggle[aria-expanded=true] svg{transform:rotate(180deg)}
.expanded{margin-top:12px;padding:6px;background:#f6f9f7;border:1px solid var(--line);border-radius:18px}
body.master .expanded{background:#faf8f2}
.expanded[hidden]{display:none}
.expanded .result{background:#fff;margin:4px 0;border:1px solid #edf1ee}
.expanded .result:hover{background:var(--accent-soft)}

/* 블랙마스터 영업 시작 */
.sales-entry{display:flex;align-items:center;gap:16px;margin-bottom:22px;padding:22px 24px;border-radius:var(--r-xl);background:linear-gradient(120deg,#1d2622 0%,#2a3530 100%);color:#f4efe2;box-shadow:0 10px 26px rgba(29,38,34,.22);position:relative;overflow:hidden}
.sales-entry::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(212,173,85,.22),transparent 70%)}
.sales-entry .s-art{flex:none;width:64px;height:64px;border-radius:18px;background:#f5eedd;display:grid;place-items:center;position:relative;z-index:1}
.sales-entry .s-art img{width:54px;height:54px}
.sales-title{flex:1;min-width:0;position:relative;z-index:1}
.sales-title b{display:block;font-size:22px;font-weight:800;color:var(--gold,#d4ad55);letter-spacing:-.02em}
.sales-title small{display:block;margin-top:6px;font-size:16px;color:#d9d2bf}
.sales-entry button{position:relative;z-index:1;min-height:56px;padding:0 24px;border-radius:15px;background:linear-gradient(180deg,#e2c072,#c99e45);color:#1d2622;font-size:17px;font-weight:800;white-space:nowrap}
.sales-entry button.secondary{background:transparent;border:1.5px solid #d4ad55;color:#f1d48a}
.sales-entry button:hover{filter:brightness(1.06)}

/* ===== 오리지널 ===== */
.sidebar{display:none}
.original-shell .sidebar{display:flex;flex-direction:column;gap:4px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;min-height:100vh;align-self:stretch}
.sidebar-logo{width:124px;margin:4px 8px 18px}
.side-title{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--accent);margin:14px 10px 6px}
.side-button{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:6px 10px;border-radius:14px;font-size:16px;font-weight:700;text-align:left;line-height:1.35;color:var(--ink)}
.side-button img{flex:none;width:40px;height:40px;padding:3px;border-radius:11px;background:linear-gradient(160deg,#f3f8f4,#EAF0CC)}
body.master .side-button img{background:linear-gradient(160deg,#faf6ec,#efe3c8)}
.side-button:hover{background:var(--accent-soft)}
.side-button.active{background:var(--accent-soft);color:var(--accent-dk);box-shadow:inset 4px 0 0 var(--accent)}
body.master .side-button.active{color:#1d2622}
body.master .original-shell .sidebar{background:#faf6ec}
body.master .portal-nav{border-bottom:3px solid var(--gold)}
.side-note{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px 0;font-size:13px;color:var(--ink-2);line-height:1.7}
.mobile-menu{display:none}
.original-shortcuts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.original-shortcuts button{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:0 20px 0 10px;border-radius:16px;background:rgba(255,255,255,.55);border:1.5px solid var(--line-2);box-shadow:none;font-size:17px;font-weight:700;color:var(--ink)}
.original-shortcuts button img{width:38px;height:38px}
.original-shortcuts button:hover{border-color:var(--accent)}
.original-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:stretch}
.original-grid .portal-lead{display:block;margin:4px 22px 18px}
.original-grid .lead-photo{min-height:200px;background-position:center 72%}
.original-grid .lead-copy{padding:22px 24px}
.news-bottom{display:flex;align-items:center;justify-content:center;min-height:58px;border-top:1px solid var(--line);font-size:16px;font-weight:700;color:var(--accent-dk)}
body.master .news-bottom{color:#6f5418}
.news-bottom:hover{background:var(--accent-soft)}
.original-grid .panel-heading{padding:22px 24px 10px}
.original-grid .news-items{padding:0 22px 8px}
.wide-panel{grid-column:1/-1}
.wide-panel .news-items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:6px 22px 24px}
.wide-panel .news-item{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 16px;min-height:96px;background:#fff;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.wide-panel .news-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}

function moduleButton(id,cls='result'){const m=modules.find(m=>m.id===id);return `<button class="${cls}" data-module="${id}"><span class="r-art">${art(id)}</span><span class="r-txt">${escapeHtml(m.name)}</span>${icon('arrow').replace('<svg','<svg class="chev"')}</button>`}
function newsItems(filter = '전체', { omitLead = false } = {}) {
  const daily = { type: '소식', title: '하루를 여는 주요 뉴스', sub: '최신 소식은 실제 루트에서 확인하세요.' };
  const selected = filter === '소식' ? [daily] : news.filter(item => filter === '전체' || item.type === filter);
  return selected.filter(item => !omitLead || item !== news[0]).map(item => `
    <button class="news-item" data-module="board" data-category="${item.type}">
      <span class="news-badge">${item.type}</span>
      <span class="news-text"><b>${tx(item.title)}</b><small>${item.sub}</small></span>
      <span class="arrow">${icon('arrow')}</span>
    </button>`).join('');
}
function hero() {
  const lead = news[0];
  return `<article class="portal-lead">
    <div class="lead-photo" role="img" aria-label="루트의 초록 나무 풍경"></div>
    <div class="lead-copy">

      <h3>${tx(lead.title)}</h3>
      <p>${lead.sub}</p>
      <button data-module="board" class="lead-action">오늘의 소식 ${icon('arrow')}</button>
    </div>
  </article>`;
}
function newsPanel() {
  const categories = ['전체','공지','영업자료','소식'];

    <button role="tab" data-news="${category}" aria-selected="${state.tab === category}">${category}</button>`).join('');
  const showLead = state.tab === '전체';
  return `<section class="news-panel">
    <div class="panel-heading"><h2>오늘의 소식</h2>
      <a class="board-link" href="${base}/planner/board">소식 전체 보기 ↗</a>

  </section>`;
}

function sideButton(id){const m=modules.find(m=>m.id===id);return `<button class="side-button" data-module="${id}">${art(id)}<span>${id==='customer'?'고객관리':m.name}</span></button>`}
function portalNavigation() {
  const links = [
    ['schedule','일정 관리'],
    ['prepare','상담 준비'], ['convenience','편의 기능']
  ];
  const services = links.map(([id, label]) =>
    `<button type="button" data-module="${id}">${label}</button>`).join('');
  const date = new Intl.DateTimeFormat('ko-KR', {
    timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'long'
  }).format(new Date());
  return `<nav class="portal-nav" aria-label="업무 메뉴">
    <span class="portal-home" aria-current="page">업무 홈</span>
    ${services}
    <time>${date}</time>
  </nav>`;
}
