<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>이지루트</title>
<link rel="icon" type="image/svg+xml" href="https://sbt-root.com/sbt_img_logo_only.svg">
<style>
  :root {
    --bar: #EAF0CC;
    --bar-ink: #1F2A12;   /* 상단 문구: 어두운 글씨색 */
    --line: #c6d8ce;
    --ink: #16261f;
    --sub: #3d5249;
    --green: #769636;
    --bg: #EAF0CC;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Pretendard, "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }

  /* ── 상단 막대 ── */
  .bar {
    flex: 0 0 auto;
    position: relative;
    height: 60px;
    background: var(--bar);
    box-shadow: 0 1px 0 rgba(118,150,54,.25);
    display: flex; align-items: center;
    padding: 0 16px;
    z-index: 10;
  }
  .seg {
    display: flex; gap: 4px; padding: 4px;
    background: rgba(255,255,255,.6);
    border: 1px solid #EAF0CC;
    border-radius: 14px;
  }
  .seg button {
    height: 38px; padding: 0 16px;
    border: 0; border-radius: 10px;
    background: transparent; color: var(--bar-ink);
    font: inherit; font-size: 15px; font-weight: 700; line-height: 1;
    cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .seg button:hover { background: rgba(255,255,255,.55); }
  .seg button[aria-pressed="true"] { background: #fff; color: #1F2A12; cursor: default; box-shadow: 0 2px 8px rgba(118,150,54,.25); }
  .seg--mode { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .bar-logo { height: 30px; width: auto; display: block; }
  .bar-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .bar-tag { font-size: 14px; font-weight: 700; color: var(--bar-ink); white-space: nowrap; padding-left: 12px; border-left: 1px solid rgba(31,42,18,.25); line-height: 1.2; }
  @media (max-width: 1100px) { .bar-tag { display: none; } }
  /* PC/모바일: 검토용 전환이라 작고 흐리게 (실제 고객 화면에는 없음) */
  .seg--device { margin-left: auto; padding: 2px; border-radius: 9px; opacity: .45; transition: opacity .15s; }
  .seg--device:hover, .seg--device:focus-within { opacity: 1; }
  .seg--device button { height: 26px; padding: 0 10px; font-size: 12px; border-radius: 7px; }

  /* ── 화면 영역 ── */
  .stage {
    flex: 1 1 auto; min-height: 0;
    display: flex; justify-content: center; align-items: stretch;
    overflow: auto;
  }
  .device {
    position: relative;
    width: 100%; height: 100%;
    background: #fff;
    overflow: hidden;
  }
  body.is-mobile .stage { align-items: flex-start; padding: 24px 16px; }
  body.is-mobile .device {
    flex: 0 0 auto;
    width: 390px; height: min(844px, calc(100vh - 60px - 48px));
    border: 10px solid #1c2420; border-radius: 44px;
    box-shadow: 0 20px 60px rgba(118,150,54,.25);
  }
  .device > iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; background: #fff;
  }
  .device > iframe[hidden] { display: none; }

  /* ── ROOT 페이지 보기 (메뉴를 누르면 이 안에서 열림) ── */
  .viewer {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: #fff;
    z-index: 5;
  }
  .viewer[hidden] { display: none; }
  .viewer-bar {
    flex: 0 0 auto;
    height: 48px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px 0 20px;
    background: #f4f8f6;
    border-bottom: 1px solid var(--line);
  }
  .viewer-bar button, .viewer-bar a {
    height: 34px; padding: 0 12px;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--sub);
    font: inherit; font-size: 14px; font-weight: 700;
    text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .viewer-bar button:hover, .viewer-bar a:hover { background: #EAF0CC; }
  #viewerOut { display: none !important; }
  .viewer-bar .viewer-home { background: #769636; border-color: #769636; color: #fff; }
  .viewer-bar .viewer-home:hover { background: #769636; }
  .viewer-title {
    flex: 1 1 auto; min-width: 0;
    font-size: 15px; font-weight: 800; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* ROOT 좌측 사이드바(270px)는 다른 사이트라 직접 못 숨겨서, 프레임을 왼쪽으로 270px 밀어 가린다 */
  .viewer-crop { position: relative; flex: 1 1 auto; overflow: hidden; }
  .viewer-crop iframe { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .viewer-hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: rgba(118,150,54,.92); color: #fff;
    padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5;
    max-width: calc(100% - 32px); text-align: center;
    pointer-events: none; opacity: 0; transition: opacity .3s;
  }
  .viewer-hint.is-on { opacity: 1; }

  @media (max-width: 760px) {
    .bar { padding: 0 8px; }
    .seg button { padding: 0 10px; font-size: 13px; height: 34px; }
    .seg--device { display: none; }        /* 실제 폰에서는 PC/모바일 전환 불필요 */
    .seg--mode { position: static; transform: none; margin: 0 auto; }
  }

  /* 미리보기 빌드 전용: ROOT 화면 대신 안내 */
  .pv-notice { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: #fff; overflow: auto; }
  .pv-notice[hidden] { display: none; }
  .pv-card { width: min(440px, 100%); background: #fff; border: 2px solid #B5D334; border-radius: 24px; overflow: hidden; text-align: center; }
  .pv-top { background: #EAF0CC; padding: 22px 16px 14px; }
  .pv-top img { width: 110px; height: auto; display: block; margin: 0 auto; }
  .pv-tag { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 800; color: #769636; letter-spacing: .04em; }
  .pv-body { padding: 18px 22px 24px; }
  .pv-body h2 { margin: 0 0 10px; font-size: 21px; font-weight: 800; line-height: 1.4; color: var(--ink); word-break: keep-all; }
  .pv-body p { margin: 0 0 18px; font-size: 15px; line-height: 1.65; color: var(--sub); word-break: keep-all; }
  .pv-body b { color: var(--ink); }
  .pv-home { height: 46px; padding: 0 24px; border: 2px solid #769636; border-radius: 12px; background: #769636; color: #fff; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
  .pv-home:hover { border-color: #B5D334; }
</style>
</head>
<body>
  <header class="bar">
    <div class="bar-brand"><img class="bar-logo" src="assets/logo-root.svg" alt="ROOT"><span class="bar-tag">보험설계사 영업 지원 시스템</span></div>
    <nav class="seg seg--mode" aria-label="화면 모드">
      <button type="button" data-mode="simple" aria-pressed="true">간편모드</button>
      <button type="button" data-mode="normal" aria-pressed="false">전체모드</button>
    </nav>
    <nav class="seg seg--device" aria-label="화면 크기">
      <button type="button" data-device="pc" aria-pressed="true">PC</button>
      <button type="button" data-device="mobile" aria-pressed="false">모바일</button>
    </nav>
  </header>

  <main class="stage">
    <div class="device" id="device">
      <iframe id="frameSimple" title="간편모드" data-src="맞춤형.html"></iframe>
      <iframe id="frameNormal" title="전체모드" data-src="일반모드.html" hidden></iframe>
      <section class="viewer" id="viewer" hidden aria-label="ROOT 페이지">
        <div class="viewer-bar">
          <button type="button" id="viewerBack" class="viewer-home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>홈 화면</button>
          <span class="viewer-title" id="viewerTitle"></span>
          <a id="viewerOut" href="#" hidden></a>
        </div>
        <div class="viewer-crop" id="viewerCrop"><div class="pv-notice" id="pvNotice" hidden><div class="pv-card"><div class="pv-top"><img src="assets/ruti/wave.png" alt=""><span class="pv-tag">화면 미리보기</span></div><div class="pv-body"><h2>이 기능은 실제 ROOT 서비스에서 열려요</h2><p>지금은 이지루트 <b>화면 미리보기</b>예요.<br><b id="pvName"></b> 화면은 ROOT에 로그인하면 바로 쓸 수 있어요.</p><button type="button" class="pv-home" id="pvHome">홈 화면으로</button></div></div></div><iframe id="viewerFrame" title="ROOT 페이지" allow="clipboard-write; microphone; geolocation"></iframe></div>
        <div class="viewer-hint" id="viewerHint" hidden></div>
      </section>
    </div>
  </main>

<script>
(function () {
  'use strict';
  var ROOT = 'https://sbt-root.com';
  var KEY = 'minroot:shell';
  var $ = function (s) { return document.querySelector(s); };

  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  var state = {
    device: saved.device === 'mobile' ? 'mobile' : 'pc',
    mode: location.hash === '#normal' ? 'normal' : 'simple'   // 열면 항상 간편모드 먼저 (마지막 모드는 기억하지 않음)
  };
  var save = function () { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  // 새로고침할 때마다 최신 수정본을 읽도록 주소 끝에 시간값을 붙여 연다 (모드 전환 때는 다시 읽지 않음)
  var stamp = Date.now();
  function load(frame) {
    if (!frame.getAttribute('src')) frame.src = frame.dataset.src + '?v=' + stamp;
  }

  function apply() {
    document.body.classList.toggle('is-mobile', state.device === 'mobile');
    document.querySelectorAll('[data-device]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.device === state.device)); });
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)); });
    var simple = $('#frameSimple'), normal = $('#frameNormal');
    var cur = state.mode === 'normal' ? normal : simple;
    load(cur);
    simple.hidden = cur !== simple;
    normal.hidden = cur !== normal;
    closeViewer();
    if (!$('#viewer').hidden) cropSidebar();
    document.title = '이지루트 · ' + (state.mode === 'normal' ? '전체모드' : '간편모드');
    save();
  }

  document.querySelectorAll('[data-device]').forEach(function (b) {
    b.addEventListener('click', function () { state.device = b.dataset.device; apply(); });
  });
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () { state.mode = b.dataset.mode; apply(); });
  });

  // ── ROOT 페이지를 화면 안에서 열기 ──
  var hintTimer = null;
  function openViewer(path, title, left) {
    if (typeof path !== 'string' || path.charAt(0) !== '/') return;
    // 로컬 서버(localhost:5173)로 열었으면 ROOT 를 같은 주소로 열어 로그인 공유 + 사이드바 직접 제거
    // 미리보기: 우리 페이지(terms.html·cases.html)는 그대로 열고, ROOT 화면은 안내로 대신함
    var NS = /^\/planner\/new-sales/.test(path);   // 뉴 세일즈: 원본과 같은 「준비 중」 화면(new-sales.html)
    var OURS = NS || /^\/[^\/]+\.html(?:[?#]|$)/.test(path);
    var SAME = OURS;
    var url = NS ? 'new-sales.html' : OURS ? path.slice(1) : 'about:blank';
    $('#pvName').textContent = '「' + (title || 'ROOT') + '」';
    $('#pvNotice').hidden = OURS;
    $('#viewerTitle').textContent = title || path;
    $('#viewerOut').href = ROOT + path;
    $('#viewerFrame').dataset.same = SAME ? '1' : '';
    $('#viewerFrame').src = url;
    // 전체모드에서는 좌측 메뉴를 가리지 않고 그 오른쪽에 페이지를 연다
    $('#viewer').style.left = (state.mode === 'normal' && left > 0) ? left + 'px' : '0';
    $('#viewer').hidden = false;
    cropSidebar();
    var hint = $('#viewerHint');
    // 이미 로그인한 적이 있으면(같은 주소의 ROOT 로그인 정보가 있으면) 안내 문구를 띄우지 않음
    var loggedIn = false;
    try { loggedIn = !!localStorage.getItem('token'); } catch (e) {}
    if (loggedIn && SAME) { hint.classList.remove('is-on'); return; }
    /* 안내 문구는 띄우지 않음 (요청) */
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hint.classList.remove('is-on'); }, 4000);
  }
  // ROOT 는 화면 폭이 1024px 보다 넓을 때만 좌측 사이드바(270px)를 고정 표시 → 그때만 왼쪽으로 밀어서 가림
  var SIDEBAR = 270, ROOT_BREAK = 1024;
  function cropSidebar() {
    var box = $('#viewerCrop'), f = $('#viewerFrame');
    if (f.dataset.same === '1') { f.style.left = '0'; f.style.width = '100%'; return; }
    var w = box.clientWidth;
    if (w + SIDEBAR > ROOT_BREAK) { f.style.left = -SIDEBAR + 'px'; f.style.width = (w + SIDEBAR) + 'px'; }
    else { f.style.left = '0'; f.style.width = '100%'; }
  }
  window.addEventListener('resize', cropSidebar);
  function closeViewer() {
    if (!$('#viewer').hidden) { try { $('#frameNormal').contentWindow.postMessage({ type: 'minroot:closed' }, '*'); } catch (e) {} }
    $('#viewer').hidden = true;
    $('#viewerFrame').src = 'about:blank';
  }
  var HIDE = '.fc-modal-overlay:has(.fcn-daily-modal){display:none!important}.planner-sidebar,.fc-drawer-overlay,.fc-topbar-hamburger{display:none!important}.planner-main{margin-left:0!important;width:100%!important;max-width:none!important}';
  $('#viewerFrame').addEventListener('load', function () {
    var f = $('#viewerFrame');
    if (f.dataset.same !== '1') return;
    // ROOT 편의 기능 페이지에서 숨기는 카드: 미청구(좌측 메뉴로 분리) · 응급병원 평가기준표 · 실시간 약국 찾기(삭제)
    var hideUnclaimed = function (doc) { doc.querySelectorAll('.fcdh-card').forEach(function (c) { var ti = c.querySelector('.fcdh-card-title'); if (ti && ['미청구 보험금 찾기', '응급병원 평가기준표', '실시간 약국 찾기'].indexOf(ti.textContent.trim()) >= 0) c.style.display = 'none'; }); };
    // 고객관리 화면 등에서 'ADSS' 글자 제거 (예: 'ADSS(고객관리)' → '고객관리', 'ADSS 고객' → '고객')
    var noAdss = function (doc) { try { var w = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT), n; while ((n = w.nextNode())) { if (n.nodeValue.indexOf('ADSS') >= 0) { var v = n.nodeValue.replace(/ADSS\s*\(([^)]*)\)/g, '$1').replace(/\(\s*ADSS\s*\)/g, '').replace(/ADSS\s*[·:\-|]?\s*/g, ''); if (v !== n.nodeValue) n.nodeValue = v; } } if (doc.title.indexOf('ADSS') >= 0) doc.title = doc.title.replace(/ADSS\s*/g, ''); doc.querySelectorAll('[placeholder*="ADSS"],[title*="ADSS"],[alt*="ADSS"]').forEach(function (e) { ['placeholder', 'title', 'alt'].forEach(function (a) { var x = e.getAttribute(a); if (x && x.indexOf('ADSS') >= 0) e.setAttribute(a, x.replace(/ADSS\s*/g, '')); }); }); } catch (e) {} };
    // 뉴 세일즈 화면: 바로 열리는 5개만 남김(「개발 예정」 5개는 숨김) (2026-11-13)
    var NS_KEEP = ['힘내라 사장님', '혼자여도 괜찮아', '가자 서울대', '아프지마 라이더', '화이팅, 청년농어민'];
    var onlyTwo = function (doc) { doc.querySelectorAll('.fcns-grid .fcns-card').forEach(function (c) { var t = (c.getAttribute('aria-label') || '').replace(/ 열기$/, ''); if (NS_KEEP.indexOf(t) < 0) c.style.display = 'none'; }); };
    // 뉴 세일즈: 목록은 카드 5개를 흐리게 보여 주고 그 위에 「준비 중」 안내, 안쪽 페이지는 화면 전체를 안내로 덮음 (2026-11-13)
    var NS_SOON_HTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:14px;max-width:560px;width:100%;box-sizing:border-box;padding:34px 36px;background:#fff;border:2px solid #B5D334;border-radius:24px;box-shadow:0 18px 48px rgba(31,42,18,.18)">' +
      '<div style="font-size:52px;line-height:1">🌱</div><p style="margin:0;font-size:14px;font-weight:800;letter-spacing:.06em;color:#769636">뉴 세일즈 · 오픈 준비 중</p>' +
      '<h2 style="margin:0;font-size:30px;font-weight:800;line-height:1.35;color:#1F2A12">더 좋은 모습으로 준비하고 있어요</h2>' +
      '<p style="margin:0;font-size:18px;line-height:1.6;color:#5b6152">고객 유형별 상담 도구를 꼼꼼히 다듬는 중이에요.<br>조금만 기다려 주세요, 곧 열어 드릴게요!</p>' +
      '<button type="button" style="margin-top:10px;height:46px;padding:0 22px;border:0;border-radius:12px;background:#769636;color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer">홈으로 돌아가기</button></div>';
    var nsReady = function (doc) {
      var path = doc.location.pathname, box = doc.getElementById('mrSoon');
      var inner = /^\/planner\/new-sales\/./.test(path), list = /^\/planner\/new-sales\/?$/.test(path);
      var host = list ? doc.querySelector('.fcns-content') : inner ? (doc.body || doc.documentElement) : null;
      if (!host) { if (box) box.remove(); return; }
      if (box && box.parentNode === host) return;
      if (box) box.remove();
      box = doc.createElement('div'); box.id = 'mrSoon';
      var base = 'z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Pretendard,system-ui,sans-serif;text-align:center;padding:24px;';
      if (list) { if (doc.defaultView.getComputedStyle(host).position === 'static') host.style.position = 'relative';
        box.setAttribute('style', 'position:absolute;inset:0;' + base + 'background:rgba(246,247,242,.38);border-radius:20px'); }
      else box.setAttribute('style', 'position:fixed;inset:0;' + base + 'z-index:2147483000;background:#F6F7F2');
      box.innerHTML = NS_SOON_HTML;
      box.querySelector('button').addEventListener('click', function () { try { window.document.getElementById('viewerBack').click(); } catch (e) { doc.defaultView.history.back(); } });
      host.appendChild(box);
    };
    var hideUnclaimed0 = hideUnclaimed; hideUnclaimed = function (doc) { hideUnclaimed0(doc); noAdss(doc); onlyTwo(doc); nsReady(doc); };
    try { hideUnclaimed(f.contentDocument); new MutationObserver(function () { hideUnclaimed(f.contentDocument); }).observe(f.contentDocument.documentElement, { childList: true, subtree: true }); } catch (e) {}
    try { var dd = f.contentDocument; new MutationObserver(function () { if (!dd.getElementById('mrHide')) { var s2 = dd.createElement('style'); s2.id = 'mrHide'; s2.textContent = HIDE; (dd.head || dd.documentElement).appendChild(s2); } }).observe(dd.documentElement, { childList: true, subtree: true }); } catch (e) {}
    try { var d = f.contentDocument; if (d && !d.getElementById('mrHide')) { var st = d.createElement('style'); st.id = 'mrHide'; st.textContent = '.fc-modal-overlay:has(.fcn-daily-modal){display:none!important}.planner-sidebar,.fc-drawer-overlay,.fc-topbar-hamburger{display:none!important}.planner-main{margin-left:0!important;width:100%!important;max-width:none!important}'; d.head.appendChild(st); } } catch (e) {}
  });
  $('#viewerBack').addEventListener('click', closeViewer);
  $('#pvHome').addEventListener('click', closeViewer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#viewer').hidden) closeViewer(); });

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'minroot:open') return;
    // 우리 화면(간편/일반 iframe)에서 온 요청만 받음
    if (e.source !== $('#frameSimple').contentWindow && e.source !== $('#frameNormal').contentWindow) return;
    openViewer(d.path, d.title, +d.left || 0);
  });

  apply();
})();
</script>
</body>
</html>
